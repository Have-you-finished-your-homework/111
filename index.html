<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>谁不想急头白脸听上这么几首</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/aplayer/1.10.1/APlayer.min.css">
  <script src="https://cdn.bootcdn.net/ajax/libs/aplayer/1.10.1/APlayer.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/meting/2.0.1/Meting.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 40px; background: #fafafa; min-height: 100vh; }
    h1 { font-size: 20px; color: #333; }

   #sidebar {
  position: fixed; top: 0; left: 0;
  width: 400px; max-width: 90vw; height: 100vh;
  background: #fff;
  box-shadow: 4px 0 20px rgba(0,0,0,0.1);
  transform: translateX(-100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 999;
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar.open { transform: translateX(0); }

    #sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0; gap: 8px;
    }
    #sidebar-header h2 { font-size: 15px; margin: 0; color: #333; font-weight: 600; flex: 1; }

    .icon-btn {
      background: none; border: none; font-size: 18px; cursor: pointer;
      color: #999; padding: 4px 8px; line-height: 1; border-radius: 6px;
      transition: all 0.2s;
    }
    .icon-btn:hover { color: #333; background:#0446FE  }
    #close-btn { font-size: 22px; }

    #sidebar-body { flex: 1; overflow-y: auto; padding: 12px; }

    #now-playing {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .cover-wrap {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(4,70,254,1)
      background: #eee;
      position: relative;
    }
    #cover {
      width: 100%;
      height: 100%;
      background: #eee center/cover no-repeat;
      border-radius: 50%;
      position: relative;
      animation: spin 20s linear infinite;
      animation-play-state: paused;
    }
    #cover.playing {
      animation-play-state: running;
    }
    #cover::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #now-title {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #now-artist {
      margin-top: 4px;
      font-size: 12px;
      color: #999;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ========== 控制按钮组 ========== */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 18px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #333;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      border-radius: 50%;
    }
    .ctrl-btn:hover { color: #0446FE; }
    .ctrl-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }
    .ctrl-btn.main {
      width: 52px;
      height: 52px;
      background: #0446FE;
      color: #fff;
      box-shadow: 0 4px 12px rgba(4,70,254,1)
    }
    .ctrl-btn.main:hover {
      background: #0446FE;
      color: #fff;
      transform: scale(1.06);
    }
    .ctrl-btn.main svg {
      width: 22px;
      height: 22px;
    }

    #player-container .aplayer .aplayer-pic { display: none !important; }
    #player-container .aplayer .aplayer-info .aplayer-music { display: none !important; }
    #player-container .aplayer { width: 100% !important; margin: 0 !important; box-shadow: none !important; }
    #player-container .aplayer .aplayer-list { max-height: none !important; }

    #toggle-btn {
  position: fixed; top: 28px; left: 28px; z-index: 1000;
  width: 26px; height: 34px; border: none; background: #0446fe;
  clip-path: polygon(100% 0, 100% 100%, 0 50%);
  cursor: pointer; padding: 0;
  transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1),
              clip-path 0.35s ease,
              filter 0.3s ease;
  filter: drop-shadow(0 3px 8px rgba(4,70,254,0.35));
}
#toggle-btn:hover { filter: drop-shadow(0 4px 14px rgba(4,70,254,0.6)); }

/* ④ 按钮打开位置：跟着侧边栏宽度走 */
#sidebar.open ~ #toggle-btn {
 left: calc(min(400px, 90vw) + 6px);
  clip-path: polygon(0 0, 0 100%, 100% 50%);
}

@media (max-width: 600px) {
  body { padding: 18px 16px 18px 60px; }

  h1 { font-size: 18px; }

  /* 侧边栏占满大半屏，右侧留出按钮位置 */
  #sidebar {
    width: 88vw;
    max-width: 88vw;
    height: 100vh;
    height: 100dvh;   /* 支持时用动态视口，避开手机地址栏 */
  }

  /* 按钮跟着侧边栏宽度走 */
  #sidebar.open ~ #toggle-btn {
    left: calc(88vw + 6px);
  }

  /* 按钮缩小一点，避开标题 */
  #toggle-btn {
    top: 16px;
    left: 16px;
    width: 22px;
    height: 30px;
  }

  /* 顶部信息区压缩 */
  #sidebar-header { padding: 12px 16px; }
  #sidebar-body   { padding: 8px; }
  #now-playing    { padding: 16px 8px 12px; }

  .cover-wrap { width: 120px; height: 120px; }

  #now-title  { margin-top: 10px; font-size: 13px; }
  #now-artist { font-size: 11px; }

  /* 控制按钮组紧凑一点 */
  #controls { gap: 16px; margin-top: 12px; }
  .ctrl-btn svg { width: 24px; height: 24px; }
  .ctrl-btn.main { width: 46px; height: 46px; }
  .ctrl-btn.main svg { width: 20px; height: 20px; }

  /* 列表高度限制，避免撑破侧边栏 */
  #player-container .aplayer .aplayer-list {
    max-height: 45vh !important;
  }
}


  </style>
</head>
<body>

  <h1>♪（-u- ）♪</h1>
  <p style="color:#666;">点击爽听 ←</p>

  <div id="sidebar" class="open">
    <div id="sidebar-header">
      <h2>我的歌单</h2>
      <button id="close-btn" class="icon-btn" onclick="toggleSidebar()">×</button>
    </div>
    <div id="sidebar-body">

      <div id="now-playing">
        <div class="cover-wrap">
          <div id="cover"></div>
        </div>
        <div id="now-title">未播放</div>
        <div id="now-artist">—</div>

        <div id="controls">
          <button class="ctrl-btn" onclick="playPrev()" aria-label="上一首">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="play-btn" class="ctrl-btn main" onclick="ap && ap.toggle()" aria-label="播放/暂停">
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" onclick="playNext()" aria-label="下一首">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
        </div>
      </div>

      <div id="status">正在加载歌单...</div>
      <div id="player-container"></div>
    </div>
  </div>

  <button id="toggle-btn" onclick="toggleSidebar()" aria-label="切换播放器"></button>

  <script>
    let ap = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // ========== 切歌 ==========
    function playPrev() {
      if (!ap || !ap.list) return;
      const len = ap.list.audios.length;
      if (len === 0) return;
      // 优先用 APlayer 内置方法（会正确处理随机模式）
      if (typeof ap.skipBack === 'function') {
        ap.skipBack();
      } else {
        // 手动回退
        const idx = (ap.list.index - 1 + len) % len;
        ap.list.switch(idx);
        ap.play();
      }
    }

    function playNext() {
      if (!ap || !ap.list) return;
      const len = ap.list.audios.length;
      if (len === 0) return;
      if (typeof ap.skipForward === 'function') {
        ap.skipForward();
      } else {
        const idx = (ap.list.index + 1) % len;
        ap.list.switch(idx);
        ap.play();
      }
    }

    // ========== 封面旋转 ==========
    function setCoverPlaying(playing) {
      const cover = document.getElementById('cover');
      if (playing) cover.classList.add('playing');
      else cover.classList.remove('playing');
    }

    // ========== 播放/暂停图标 ==========
    const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
    const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

    function setPlayIcon(isPlaying) {
      document.getElementById('play-icon').innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    }

    // ========== 更新顶部信息 ==========
    function updateNowPlaying() {
      if (!ap) return;
      const idx = ap.list.index;
      const song = ap.list.audios[idx];
      if (!song) return;

      document.getElementById('cover').style.backgroundImage = `url(${song.cover || ''})`;
      document.getElementById('now-title').textContent = song.name || '未知歌曲';
      document.getElementById('now-artist').textContent = song.artist || '未知艺术家';
    }

    // ========== 工具函数 ==========
    function normalizeName(str) {
      return (str || '')
        .toLowerCase()
        .replace(/[\s\-_\(\)\[\]（）【】,.、·'"：:!！?？]/g, '')
        .replace(/(live|remix|remaster|伴奏|纯音乐|cover|翻自|版|原唱|翻唱|无损|高音质|现场|演唱会|demo|ost|主题曲|插曲|片尾曲|片头曲|feat|ft)/gi, '')
        .trim();
    }

    function normalizeArtist(str) {
      let s = '';
      if (Array.isArray(str)) {
        s = str.map(x => typeof x === 'string' ? x : (x.name || '')).join('/');
      } else if (str && typeof str === 'object') {
        s = str.name || '';
      } else {
        s = String(str || '');
      }
      s = s.split(/[\/、,&，]/)[0] || '';
      return s.toLowerCase().replace(/[\s\-_\(\)\[\]（）【】,.、·'"：:]/g, '').trim();
    }

    function getSongName(song) {
      return song.name || song.title || song.songname || '';
    }

    function getSongArtist(song) {
      const a = song.artist || song.author || song.singer || '';
      if (Array.isArray(a)) return a.map(x => typeof x === 'string' ? x : (x.name || '')).join('/');
      if (a && typeof a === 'object') return a.name || '';
      return String(a);
    }

    async function getPlaylist(server, id) {
      // 这里把 server 和 id 拼接到 URL 上了！
      const url = `https://api.injahow.cn/meting/?server=${server}&type=playlist&id=${id}`;
      try {
        const res = await fetch(url);
        const text = await res.text();
        try {
          const data = JSON.parse(text);
          console.log(`✅ ${server} 拿到 ${data.length} 首`);
          return Array.isArray(data) ? data : [];
        } catch (e) {
          console.log(`❌ ${server} 返回的不是 JSON，返回内容：`, text.slice(0, 100));
          return [];
        }
      } catch (e) {
        console.log(`❌ ${server} 请求失败`, e);
        return [];
      }
    }
    function dedupe(songs) {
      const unique = [];
      const nameIndex = new Map();
      songs.forEach(song => {
        const name = normalizeName(getSongName(song));
        const artist = normalizeArtist(getSongArtist(song));
        if (!name) return;
        let isDuplicate = false;
        const sameNameList = nameIndex.get(name) || [];
        for (const existing of sameNameList) {
          const existArtist = normalizeArtist(getSongArtist(existing));
          if (existArtist === artist ||
              (existArtist && artist && (existArtist.includes(artist) || artist.includes(existArtist)))) {
            isDuplicate = true;
            break;
          }
        }
        if (!isDuplicate) {
          unique.push(song);
          if (!nameIndex.has(name)) nameIndex.set(name, []);
          nameIndex.get(name).push(song);
        }
      });
      return unique;
    }

    const CACHE_KEY = 'music_cache_v3';
    const CACHE_TIME = 1000 * 60 * 60;

    function loadCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (Date.now() - obj.time > CACHE_TIME) return null;
        return obj.songs;
      } catch (e) { return null; }
    }

    function saveCache(songs) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), songs }));
      } catch (e) {}
    }

    // ========== 主流程 ==========
    (async function main() {
      const status = document.getElementById('status');
      const container = document.getElementById('player-container');

      if (typeof APlayer === 'undefined') {
        status.innerHTML = '<span style="color:red;">❌ APlayer 加载失败，刷新试试。</span>';
        return;
      }

      let aplayerSongs = null;

      const cached = loadCache();
      if (cached && cached.length > 0) {
        console.log(`⚡ 从缓存加载 ${cached.length} 首`);
        aplayerSongs = cached;
        status.textContent = `缓存 ${cached.length} 首（更新中...）`;
      }

      const [neteaseSongs, tencentSongs] = await Promise.all([
        getPlaylist('netease', '1989824770'),
        getPlaylist('tencent', '2343079771')
      ]);

      const allSongs = neteaseSongs.concat(tencentSongs);

      if (allSongs.length > 0) {
        const uniqueSongs = dedupe(allSongs);
        console.log(`合并前 ${allSongs.length} 首，去重后 ${uniqueSongs.length} 首`);

        const fresh = uniqueSongs.map(song => ({
          name: getSongName(song),
          artist: getSongArtist(song),
          url: song.url || song.src || song.link || '',
          cover: song.pic || song.cover || '',
          lrc: song.lrc || song.lyric || ''
        }));

        saveCache(fresh);
        aplayerSongs = fresh;
        status.textContent = `网易云 ${neteaseSongs.length} + QQ ${tencentSongs.length} = ${allSongs.length} 首，去重后 ${fresh.length} 首`;
      }

      if (!aplayerSongs || aplayerSongs.length === 0) {
        status.innerHTML = '<span style="color:red;">❌ 歌单加载失败。</span>';
        return;
      }

      container.innerHTML = '';
      ap = new APlayer({
        container: container,
        audio: shuffle(aplayerSongs),
        listFolded: false,
        listMaxHeight: 400,
        fixed: false,
        mode: 'list'
      });

      ap.on('play', () => {
        setCoverPlaying(true);
        setPlayIcon(true);
      });
      ap.on('pause', () => {
        setCoverPlaying(false);
        setPlayIcon(false);
      });
      ap.on('listswitch', () => {
        updateNowPlaying();
      });
      ap.on('canplay', () => {
        updateNowPlaying();
      });

      setTimeout(updateNowPlaying, 200);
    })();
  </script>

</body>
</html>
